# Infra compartilhada (Postgres + Redis) para vários apps no mesmo servidor.
# Tunado para uma máquina de 12GB RAM / 6 vCPU / NVMe rodando também os apps (pm2).
# Segredos ficam em .env (gitignored): POSTGRES_PASSWORD e REDIS_PASSWORD.
#
# Por app, crie um role + database próprios no Postgres (não use o superusuário):
#   CREATE ROLE carestia LOGIN PASSWORD '...';
#   CREATE DATABASE carestia OWNER carestia;
#
# Redis: uma instância só, política `noeviction` (fila/BullMQ nunca perde job).
# Todos os apps compartilham, separando as chaves por prefixo (carestia:*, minha_api:*).
# ATENÇÃO: como é `noeviction`, toda chave de CACHE deve ter TTL — senão a memória
# cresce até as gravações falharem (a fila não é despejada de propósito).

services:
  postgres:
    image: postgres:18
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: postgres   # apenas o banco de bootstrap; crie um DB por app

    ports:
      - "127.0.0.1:5432:5432"

    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=32MB
      - -c
      - max_connections=150
      - -c
      - wal_compression=zstd
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    mem_limit: 3g

  redis:
    image: redis:8
    container_name: redis
    restart: unless-stopped

    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
      - --appendonly
      - "yes"
      - --maxmemory
      - "512mb"
      - --maxmemory-policy
      - "noeviction"

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

    mem_limit: 1g

volumes:
  postgres_data:
  redis_data:
