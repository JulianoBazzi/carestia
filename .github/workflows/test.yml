name: CI

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - master

jobs:
  check:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest

    env:
      # Valores fictícios: o build e os testes não acessam banco/Redis de verdade,
      # mas o client do Prisma e a validação do AUTH_SECRET exigem as variáveis.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-secret-with-at-least-32-characters-0000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Versão do pnpm vem do campo `packageManager` do package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:run

      - name: Build
        run: pnpm build
